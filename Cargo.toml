[package]
name = "interval-align"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Align timestamped samples onto intervals: time-weighted means, sums, or counter deltas, with coverage and no interpolation."
repository = "https://github.com/Volt-Labs-Technology/interval-align"
homepage = "https://github.com/Volt-Labs-Technology/interval-align"
documentation = "https://docs.rs/interval-align"
readme = "README.md"
license = "MIT"
keywords = ["interval", "timeseries", "alignment", "coverage", "metrics"]
categories = ["science", "date-and-time"]

[dependencies]
thiserror = "1"
